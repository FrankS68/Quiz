# nginx auf IONOS fuer https://quiz.segieth.cologne (wie knownet.segieth.cologne).
# Einrichten (als fse, mit sudo):
#   sudo cp deploy/nginx-quiz.segieth.cologne.conf /etc/nginx/sites-available/quiz.segieth.cologne
#   sudo ln -s /etc/nginx/sites-available/quiz.segieth.cologne /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
upstream quiz {
    server 127.0.0.1:8084;
    keepalive 32;
}

server {
    listen 80;
    server_name quiz.segieth.cologne;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name quiz.segieth.cologne;
    # Wildcard-Zertifikat *.segieth.cologne (gemeinsam mit knownet, games)
    ssl_certificate     /etc/nginx/ssl/segieth.cologne/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/segieth.cologne/privkey.pem;

    # Fragenkataloge und Beitragsbilder bis 10 MB (wie spring.servlet.multipart.*)
    client_max_body_size 10m;

    location / {
        proxy_pass http://quiz;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
