# Lokale, nicht eingecheckte Einstellungen (OAuth-Secrets, erster Admin), siehe application-local.properties.example.
# Alternativ ueber Umgebungsvariablen, z.B. SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
spring.config.import=optional:file:./application-local.properties

# Erster Login mit dieser Email wird automatisch Admin (witch-auth Modul)
witch-auth.first-admin-email=${FIRST_ADMIN_EMAIL:}

# Beschriftung der witch-auth Login-Seite
witch-auth.app-name=Quiz
witch-auth.app-icon=\u2753

# witch-ui: Titel in der Kopfzeile ({name} = angemeldeter Benutzer)
witch-ui.title=Moin {name}

server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# Vaadin Copilot / Dev-Tools im Browser abschalten (nur Entwicklungsmodus relevant)
vaadin.devmode.devTools.enabled=false

# Routen/Komponenten aus Quiz, witch-auth und witch-ui (alle unter de.witchcafe)
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,de.witchcafe
vaadin.pushMode=disabled

# H2 als Datei: Fragen, Ergebnisse und Benutzer bleiben ueber Neustarts erhalten
spring.datasource.url=jdbc:h2:file:./data/quiz;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate update the schema automatically or create it if it does not exist.
#
# DO NOT DO THIS IN PRODUCTION!
#
# Instead, use Flyway or another controlled way of managing your database schema.
# See https://vaadin.com/docs/latest/building-apps/forms-data/add-flyway for instructions.
spring.jpa.hibernate.ddl-auto=update
