# Lokale, nicht eingecheckte Einstellungen (OAuth-Secrets, erster Admin), siehe application-local.properties.example.
# Alternativ ueber Umgebungsvariablen, z.B. SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
spring.config.import=optional:file:./application-local.properties

# Erster Login mit dieser Email wird automatisch Admin (witch-auth Modul)
witch-auth.first-admin-email=${FIRST_ADMIN_EMAIL:}

# Beschriftung der witch-auth Login-Seite
witch-auth.app-name=Quiz
witch-auth.app-icon=\u2753

# witch-ui: Titel in der Kopfzeile ({name} = angemeldeter Benutzer)
witch-ui.title=Moin {name}

# witch-ui: Impressum (ab witch-ui 1.3.0 / witch-parent 1.3.0; Haftungsausschluss kommt aus witch-ui)
witch-ui.impressum.name=Frank Segieth
witch-ui.impressum.address=Hauptstr. 20|57636 S\u00f6rth
witch-ui.impressum.email=frank.segieth@gmail.com
# Eigene Benutzerverwaltung (BenutzerView, Rollen ADMIN/EDITOR/USER) statt der aus witch-ui
witch-ui.admin.users.enabled=false

server.port=${PORT:8080}
# Hinter nginx (IONOS): X-Forwarded-Proto/-Host uebernehmen, damit Redirects https:// verwenden
server.forward-headers-strategy=native
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# Vaadin Copilot / Dev-Tools im Browser abschalten (nur Entwicklungsmodus relevant)
vaadin.devmode.devTools.enabled=false

# Routen/Komponenten aus Quiz, witch-auth und witch-ui (alle unter de.witchcafe)
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,de.witchcafe
vaadin.pushMode=disabled

# H2 als Datei: Fragen, Ergebnisse und Benutzer bleiben ueber Neustarts erhalten
spring.datasource.url=jdbc:h2:file:./data/quiz;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate update the schema automatically or create it if it does not exist.
#
# DO NOT DO THIS IN PRODUCTION!
#
# Instead, use Flyway or another controlled way of managing your database schema.
# See https://vaadin.com/docs/latest/building-apps/forms-data/add-flyway for instructions.
spring.jpa.hibernate.ddl-auto=update

# Uploads (Fragenkataloge, Beitragsbilder)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- witch-social (Konten verbinden, Beitraege posten, Feeds) ---
# "/" bleibt die Quiz-Liste, die Feeds liegen nur unter /feeds
social.feeds-start-page=false
# Oeffentliche Adresse fuer OAuth-Redirects (Mastodon). Leer = Adresse aus dem Browser-Aufruf.
social.public-base-url=${PUBLIC_BASE_URL:}
# Schluessel fuer die Zugangstoken in der Datenbank (32 Byte Base64, openssl rand -base64 32):
# in application-local.properties bzw. auf dem Server setzen, danach nicht mehr aendern.
#social.crypto-key=

# API-Doku (springdoc): nur die REST-API, nicht die Vaadin-Routen
springdoc.api-docs.path=/api/docs/openapi.json
springdoc.packages-to-scan=de.witchcafe.quiz.api
springdoc.paths-to-match=/api/**

# --- witch-billing (gemeinsames Guthabenkonto aller Apps) ---
# Leer = Billing aus, alles frei. Auf IONOS: http://127.0.0.1:8085
witch-billing.url=${WITCH_BILLING_URL:}
# API-Key dieser App; der Billing-Dienst kennt nur den SHA-256-Hash (BILLING_KEY_HASH_QUIZ)
witch-billing.api-key=${WITCH_BILLING_API_KEY:}
# Dienst nicht erreichbar: Quiz trotzdem erlauben (false = sperren)
witch-billing.fail-open=true

# Eigener Session-Cookie-Name: Cookies trennen nicht nach Port, auf einem Host (QA) wuerden
# sich die Apps sonst gegenseitig den JSESSIONID ueberschreiben und abmelden.
server.servlet.session.cookie.name=QUIZSESSION
